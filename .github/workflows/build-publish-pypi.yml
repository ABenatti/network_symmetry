name: Build Test and Publish

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@v5

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-win_arm64 *i686 *musllinux*"
          CIBW_ARCHS: native
          CIBW_BEFORE_ALL_WINDOWS: >
            vcpkg update &&
            vcpkg install getopt:x64-windows-static &&
            vcpkg integrate install
          # Run outside the checkout so imports use the installed wheel.
          CIBW_TEST_SOURCES: "tests docs/tutorial/example.py"
          CIBW_TEST_COMMAND: >
            python -m pip check &&
            python -m unittest discover -s tests -v &&
            python docs/tutorial/example.py

      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and check source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_sdist:
    name: Test source distribution on Python ${{ matrix.python }}
    needs: [build_sdist]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            numpy: '2.0.2'
          - python: '3.14'
            numpy: '2.3.3'
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: dist-sdist
          path: dist
      - name: Build a wheel from the source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir wheelhouse
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
      - name: Test with an older compatible NumPy 2 release
        run: |
          python -m pip install "numpy==${{ matrix.numpy }}" wheelhouse/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$RUNNER_TEMP/sdist/tests" -v
          python "$RUNNER_TEMP/sdist/docs/tutorial/example.py"
      - name: Test with the latest compatible NumPy 2 and SciPy
        run: |
          python -m pip install --upgrade "numpy>=2,<3" scipy
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$RUNNER_TEMP/sdist/tests" -v
          python "$RUNNER_TEMP/sdist/docs/tutorial/example.py"

  upload_all:
    needs: [build_wheels, build_sdist, test_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List distribution files
        run: ls -l ./dist
      - uses: pypa/gh-action-pypi-publish@release/v1
